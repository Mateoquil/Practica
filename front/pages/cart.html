<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - POS System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
        <link class="favicon-pestana" rel="icon" href="./public/logo_pos.png" type="image/x-icon" sizes="32x32">
</head>
<body>

<div class="container mt-4">

    <ul class="nav nav-tabs mb-4 justify-content-between">
        <div class="d-flex">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Store</a>
            </li>
        </div>

        <div class="d-flex">
            <li class="nav-item">
                <a class="nav-link" href="account.html">
                    <i class="bi bi-person"></i> Account
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="cart.html">
                    <i class="bi bi-cart"></i> Cart
                    <span id="cartCount" class="badge bg-danger">0</span>
                </a>
            </li>
        </div>
    </ul>

    <h1 class="mb-4 text-center">Shopping Cart 🛒</h1>
    
    <!-- Empty cart message -->
    <div id="emptyCart" class="alert alert-info text-center" style="display: none;">
        <i class="bi bi-cart-x fs-1"></i>
        <p class="mt-2">Your cart is empty</p>
        <a href="index.html" class="btn btn-primary">Go to store</a>
    </div>
    
    <!-- Cart items table -->
    <div id="cartContent" class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="cartTable">
                <!-- Cart items loaded here -->
            </tbody>
        </table>
    </div>
    
    <!-- Total -->
    <div id="totalContainer" class="d-flex justify-content-end mt-3">
        <h4>Total: $<span id="cartTotal">0</span></h4>
    </div>
    
    <!-- Buttons -->
    <div id="buttonsContainer" class="mt-4 d-flex justify-content-end gap-2">
        <a href="index.html" class="btn btn-secondary">Continue shopping</a>
        <button class="btn btn-danger" onclick="clearCart()">Clear cart</button>
        <button class="btn btn-success" onclick="checkout()">Checkout</button>
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/cart.js"></script>

</body>
</html>
